    <text x="746" y="227" font-size="16" fill="#e8ecf7">Problem Set 3 · Calculus I</text>
    <text x="1168" y="227" font-size="14" fill="#aab3cc" text-anchor="end">due Mon 11:59 PM</text>

    <rect x="644" y="254" width="540" height="46" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="664" y="283" font-size="16" fill="#9fb4ff" font-weight="700">OPENS</text>
    <text x="746" y="283" font-size="16" fill="#e8ecf7">Lab 2 · Intro Chemistry</text>
    <text x="1168" y="283" font-size="14" fill="#aab3cc" text-anchor="end">today 5:00 PM</text>

    <rect x="644" y="310" width="540" height="46" rx="10" fill="#3ddc97" fill-opacity="0.08" stroke="#3ddc97" stroke-opacity="0.3"/>
    <text x="664" y="339" font-size="16" fill="#7eeabf" font-weight="700">DONE ✓</text>
    <text x="746" y="339" font-size="16" fill="#aab3cc" text-decoration="line-through">Essay Draft · English 101</text>
    <text x="1168" y="339" font-size="14" fill="#7eeabf" text-anchor="end">submitted Sep 15</text>
