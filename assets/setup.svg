<svg xmlns="http://www.w3.org/2000/svg" width="880" height="520" viewBox="0 0 880 520" role="img" aria-label="Terminal showing the three setup steps: school found, signed in, AI apps connected">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <rect x="20" y="16" width="840" height="484" rx="14" fill="#0d1117" stroke="#30363d"/>
    <path d="M20 30a14 14 0 0 1 14-14h812a14 14 0 0 1 14 14v22H20z" fill="#161b22"/>
    <circle cx="46" cy="36" r="6" fill="#ff5f57"/>
    <circle cx="66" cy="36" r="6" fill="#febc2e"/>
    <circle cx="86" cy="36" r="6" fill="#28c840"/>
    <text x="440" y="41" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#8b949e">Terminal</text>
  </g>

  <g font-family="'Cascadia Code', 'SF Mono', Menlo, Consolas, monospace" font-size="15">
    <text x="48" y="92" fill="#8b949e">$ <tspan fill="#e6edf3">npx brightspace-d2l-mcp setup</tspan></text>

    <text x="48" y="130" fill="#e6edf3" font-weight="700">Brightspace for your AI apps <tspan fill="#8b949e" font-weight="400">· setup takes about a minute</tspan></text>

    <text x="48" y="168" fill="#58a6ff" font-weight="700">Step 1/3 <tspan fill="#e6edf3">Your school</tspan></text>
    <text x="68" y="194" fill="#8b949e">Brightspace address: <tspan fill="#e6edf3">yourschool.brightspace.com</tspan></text>
    <text x="68" y="218" fill="#3fb950">✔ <tspan fill="#e6edf3">Brightspace found at https://yourschool.brightspace.com</tspan></text>

    <text x="48" y="258" fill="#58a6ff" font-weight="700">Step 2/3 <tspan fill="#e6edf3">Sign in</tspan></text>
    <text x="68" y="284" fill="#8b949e">A browser window opens. Sign in the way you normally do.</text>
    <text x="68" y="308" fill="#3fb950">✔ <tspan fill="#e6edf3">Signed in as </tspan><tspan fill="#e6edf3" font-weight="700">Alex Student</tspan></text>

    <text x="48" y="348" fill="#58a6ff" font-weight="700">Step 3/3 <tspan fill="#e6edf3">Connect your AI apps</tspan></text>
    <text x="68" y="374" fill="#e6edf3">Found: <tspan font-weight="700">Claude Desktop, Claude Code, Cursor</tspan></text>
    <text x="68" y="398" fill="#e6edf3">Connect all of them? <tspan fill="#8b949e">(Y/n)</tspan> y</text>
    <text x="68" y="422" fill="#3fb950">✔ <tspan fill="#e6edf3">Claude Desktop connected and restarted</tspan></text>

    <text x="48" y="464" fill="#3fb950" font-weight="700">All set! <tspan fill="#e6edf3" font-weight="400">Try asking: </tspan><tspan fill="#79c0ff">"What should I work on right now?"</tspan></text>
  </g>
</svg>
